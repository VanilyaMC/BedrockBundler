name: BedrockAdder
version: '${version}'
main: dev.bedrockadder.paper.BedrockAdderPlugin
api-version: '1.21.4'
description: Makes Nexo and ItemsAdder content visible to Bedrock players on Geyser.
folia-supported: true
softdepend: [Nexo, ItemsAdder, Geyser-Spigot, floodgate]
commands:
  bedrockadder:
    description: Convert custom content for Bedrock and show status.
    usage: /<command> <reload [-f]|status>
    aliases: [ba]
    permission: bedrockadder.admin
permissions:
  bedrockadder.admin:
    description: Use /bedrockadder.
    default: op
