name: BedrockBundler
version: '${version}'
main: dev.bedrockbundler.paper.BedrockBundlerPlugin
api-version: '1.21.4'
description: Makes Nexo and ItemsAdder content visible to Bedrock players on Geyser.
folia-supported: true
softdepend: [Nexo, ItemsAdder, Geyser-Spigot, floodgate]
commands:
  bedrockbundler:
    description: Convert custom content for Bedrock and show status.
    usage: /<command> <reload [-f]|status|animate <animation> [player]>
    aliases: [bb]
    permission: bedrockbundler.admin
permissions:
  bedrockbundler.admin:
    description: Use /bedrockbundler.
    default: op
